<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 1. What a browser tab, a bookmark and a search result headline show. -->
    <title>FitPass Clone | Premium Gym Access</title>
    <meta
      name="description"
      content="Gym management for members, trainers, staff and owners. QR turnstile access, workout tracking, coaching plans and subscriptions in one app."
    />

    <!-- 2. Icons. The SVG favicon covers desktop browsers; iOS ignores SVG for a
         home-screen icon and needs a PNG, so apple-touch-icon points at one. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- 3. Tints the Android Chrome address bar. Matches the blue-600 accent the
         rest of the app is built on, and the theme_color in the manifest. -->
    <meta name="theme-color" content="#2563eb" />

    <!-- 4. Web app manifest: name, icons and a standalone window when the app is
         added to a home screen. Metadata only - there is no service worker, so
         this buys the install card and the icon, not offline support. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- 5. Link previews in WhatsApp, Slack, LinkedIn and friends.
         ONE THING IS STILL MISSING HERE, deliberately:

         og:image must be an ABSOLUTE url — crawlers do not resolve a relative
         path. The production domain is not decided yet, so this stays relative
         for now. Prefix both og:url and og:image with the real origin at deploy
         time, e.g. https://fitpass.example.com/banner.png

         The images themselves are in place: public/banner.png (1200x400) and
         public/apple-touch-icon.png (180x180). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FitPass Clone | Premium Gym Access" />
    <meta
      property="og:description"
      content="Gym management for members, trainers, staff and owners. QR turnstile access, workout tracking, coaching plans and subscriptions in one app."
    />
    <meta property="og:image" content="/banner.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
