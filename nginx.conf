# =============================================================================
# Nginx server block for the FitPass SPA.
#
# This one file does two jobs at once:
#
#   1. Serve the compiled React app (static HTML/JS/CSS).
#   2. Act as a REVERSE PROXY: forward anything under /api/ to the FastAPI
#      container. Because the browser then talks to a single origin
#      (http://localhost) for both the page and the API, there is no
#      cross-origin request at all — so CORS simply never comes up in
#      production, and the SameSite=Lax auth cookie is sent normally.
#
# In development, Vite's dev server did job 2 (see the `proxy` block in
# vite.config.ts). That dev server does not exist in production, which is
# exactly why we need Nginx here.
# =============================================================================

# --- 0. WHICH SCHEME DID THE BROWSER ACTUALLY USE? ---------------------------
# Cloudflare (Tunnel or proxy) and ngrok terminate TLS at the edge and then
# speak plain HTTP to this container, so `$scheme` here is ALWAYS "http" — even
# when the user is on https://. Passing `$scheme` straight through therefore
# overwrites the `X-Forwarded-Proto: https` the edge already sent, and the
# backend concludes the request was insecure (app/main.py then never emits
# HSTS). So: trust the edge's header when there is one, and fall back to
# `$scheme` when nothing is in front of us — a bare `docker compose up` on
# localhost sends no such header, and must keep working.
#
# Trusting the header is only safe because nothing but the tunnel can reach
# this container: the compose file publishes the port on loopback only.
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    server_name _;                       # match any hostname

    # Nginx puts its exact version in the Server header and on its own error
    # pages. That tells anyone scanning which CVEs to try first, and it buys us
    # nothing, so turn it off. It becomes a bare `Server: nginx`.
    server_tokens off;

    root /usr/share/nginx/html;          # where Dockerfile.prod copied dist/
    index index.html;

    # Avatar uploads. Nginx's default limit is 1 MB, and a request over the
    # limit is rejected by the proxy with a 413 before the backend ever sees it.
    # The backend caps avatars at 2 MB, so we allow a little headroom.
    client_max_body_size 5m;

    # Compress text responses. Images and fonts are already compressed, so
    # listing them here would only waste CPU.
    gzip on;
    gzip_vary on;                        # so caches store both variants
    gzip_min_length 1024;                # tiny files get bigger when gzipped
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # NOTE ON add_header INHERITANCE (a classic Nginx footgun):
    # add_header is inherited by a location ONLY if that location declares no
    # add_header of its own. The moment a block adds one header, it loses every
    # inherited one. So the security headers below are repeated per location
    # rather than set once at server level — setting them here would have them
    # silently vanish from /index.html, which is precisely the response that
    # needs them. They are also deliberately NOT applied to /api/, because the
    # backend already sets its own and we would end up with duplicates.

    # --- 1. WEBSOCKET: the QR turnstile ------------------------------------
    # Must come BEFORE the generic /api/ block. Nginx picks the longest
    # matching prefix, so this wins for exactly this path.
    #
    # A WebSocket starts life as an HTTP request carrying `Upgrade: websocket`,
    # and the server answers "101 Switching Protocols". Nginx does NOT forward
    # hop-by-hop headers like Upgrade by default — so without the three lines
    # below the handshake quietly degrades to a normal 200 and the live QR
    # updates on the member dashboard silently stop working.
    location /api/access/ws {
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;              # WebSockets require HTTP/1.1
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;

        # An idle socket is normal here — the connection just waits for a scan.
        # The default 60s read timeout would tear it down mid-session.
        proxy_read_timeout 3600s;
    }

    # --- 2. THE API REVERSE PROXY ------------------------------------------
    # `backend` is the docker-compose service name; Docker's internal DNS
    # resolves it to that container's IP on the shared network.
    #
    # Note there is NO trailing slash on proxy_pass. With a trailing slash
    # (http://backend:8000/) Nginx would strip the /api/ prefix and request
    # /users/me instead of /api/users/me — every route would 404. The backend
    # mounts all of its routers under /api, so the prefix must survive.
    #
    # This block also carries /api/static/avatars/*.jpg, since profile pictures
    # live on the backend's disk and are resolved to /api/static/... by
    # src/utils/profile.ts.
    location /api/ {
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Tells the backend whether the ORIGINAL browser request was https.
        # Uvicorn runs plain http inside the network, so without this header
        # the app cannot know the real scheme. See the map at the top of this
        # file for why it is not simply `$scheme`.
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    }

    # --- 3. HASHED BUILD ASSETS: cache hard --------------------------------
    # Vite writes content hashes into filenames (index-29zUCL0x.js). If the
    # content changes, the filename changes, so an old file can never be stale.
    # That makes it safe to tell the browser "keep this for a year and never
    # even revalidate".
    location /assets/ {
        # One single Cache-Control header. Using `expires 1y;` as well would
        # emit a SECOND Cache-Control line (max-age only), and the browser
        # honours the first one it sees — quietly dropping `immutable`.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;             # a missing asset is a real 404
    }

    # --- 4. index.html: never cache ----------------------------------------
    # The mirror image of the rule above. index.html is the one file whose NAME
    # never changes but whose CONTENT changes on every deploy — it holds the
    # <script src> pointing at the current hashed bundle. If a browser cached
    # it, users would keep loading an old page referencing deleted JS files and
    # see a blank screen after every release.
    location = /index.html {
        add_header Cache-Control "no-cache" always;

        # Repeated here because this block declares add_header (see the note
        # near the top) — without them the main document ships bare.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # camera=(self) is not optional: /worker/scanner drives the turnstile
        # camera through html5-qrcode, and camera=() would kill it. Microphone
        # and geolocation are switched off because nothing here asks for them.
        # Only set on the two blocks that return a document — the header has no
        # meaning on a .js or .css response, so /assets/ does not repeat it.
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }

    # --- 5. HEALTH CHECK ----------------------------------------------------
    # What docker-compose.prod.yml polls (that file lives in the BACKEND repo,
    # which is where the frontend service is defined).
    #
    # An exact-match location, so it never reaches the SPA fallback below —
    # which would answer every poll with the whole of index.html and write an
    # access log line for it every ten seconds.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # --- 6. WEB APP MANIFEST: fix its content type --------------------------
    # Nginx's bundled mime.types has no entry for .webmanifest — check it
    # yourself with:
    #
    #   docker run --rm nginx:alpine grep -i manifest /etc/nginx/mime.types
    #
    # It prints nothing, so the file would fall through to the image's
    # `default_type application/octet-stream` and be served as a download rather
    # than as a manifest. One exact-match location is cheaper than shipping a
    # patched mime.types into the container.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # --- 7. SPA FALLBACK ----------------------------------------------------
    # The heart of serving a single-page app.
    #
    # React Router handles /dashboard, /profile, /admin/analytics… entirely in
    # the browser. Those paths do not exist as files on disk. That is fine while
    # navigating inside the app, but if the user hits F5 on /dashboard — or
    # pastes the link — the browser asks Nginx for /dashboard and Nginx would
    # normally answer 404.
    #
    # try_files says: look for a real file, then a directory, and if neither
    # exists, serve index.html anyway. React boots, reads the URL from
    # window.location, and renders the right page. Deep links and refresh work.
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }
}
